# ---------------------------------------------------------------------------
# A home server, in one command.
#
#   cp .env.example .env      # then edit it — it has no usable defaults
#   docker compose up -d
#
# Self-hosting is a core requirement, not a nicety (docs/architecture/03 §1):
# anyone can run a server, and the operator controls who joins. That is also
# why adversarial servers exist by design, and why the federation layer has to
# make cheating not work without any central authority.
#
# VERIFIED: the `db` service was brought up, written to, torn down with
# `docker compose down`, and brought back — the data survived. That test exists
# because the volume mount path is a real trap; see the note on it below.
# The `server` service's image build has NOT been exercised yet.
# ---------------------------------------------------------------------------
name: eyeandsickle

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation, so ORDER BY on player handles does not depend
      # on the host's locale. Changing this later means reindexing.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    volumes:
      # /var/lib/postgresql — NOT /var/lib/postgresql/data.
      #
      # PostgreSQL 18's official images moved PGDATA to
      # /var/lib/postgresql/18/docker and moved the declared VOLUME up to
      # /var/lib/postgresql. Mounting the old 17-and-earlier path silently
      # "works": the container starts, the named volume stays empty, and the
      # real cluster goes to an anonymous volume that `docker compose down`
      # orphans. Every player's inventory and balance would vanish on the first
      # container recreate, with no error anywhere.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published to the host by default. The database holds every player's
    # inventory and balance on this server; it has no business being reachable
    # from outside the compose network.
    expose:
      - "5432"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      EYEANDSICKLE_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      EYEANDSICKLE_DB_USER: ${POSTGRES_USER}
      EYEANDSICKLE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EYEANDSICKLE_PORT: 8080
      # Minecraft-style allowlist. Empty means nobody joins — closed by default
      # is the right default for a server that holds real losable player state.
      EYEANDSICKLE_ALLOWLIST_DIDS: ${EYEANDSICKLE_ALLOWLIST_DIDS:-}
      # Opt-in (docs/architecture/03 §2). Leave false for a solo or friends
      # server: no directory listing, no validator duty, no cross-server play.
      # Set the profile too, so the federation migrations actually run.
      EYEANDSICKLE_FEDERATION_ENABLED: ${EYEANDSICKLE_FEDERATION_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "${EYEANDSICKLE_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pgdata:
