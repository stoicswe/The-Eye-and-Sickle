name: build

# Every push and PR builds and tests. A `v*` tag additionally publishes a release
# carrying the runnable jars — see the `release` job.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The release job widens this for itself alone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 25 is the target CLAUDE.md fixes, not merely the version that happens to work.
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # `verify` deliberately, not `-Pit verify`: CLAUDE.md makes it an invariant that the
      # default build never requires Docker, so a container-less runner is a supported
      # configuration rather than a lucky one. The Testcontainers suite needs its own job.
      #
      # `install` rather than `package` because the reactor's own modules depend on each
      # other, and client-dist consumes the client jar.
      - name: Build, test, and package every platform
        run: mvn -B -ntp clean install

      # ⚠ A green build has repeatedly not meant a working artifact on this project, and the
      # jars are the thing being shipped. Assert they exist and carry the right native for
      # their platform: JavaFX names natives for the OS but NOT the architecture, so a
      # packaging mistake yields five jars that all look correct and half of which cannot
      # start. `file` on one library per jar is the cheapest check that would have caught it.
      - name: Verify each client jar carries its own architecture
        run: |
          set -euo pipefail
          # A `case` rather than an associative array: `declare -A` needs bash 4, which the
          # runner has and macOS does not, and a step nobody can run locally is a step nobody
          # checks before pushing.
          for p in win mac mac-aarch64 linux linux-aarch64; do
            case "$p" in
              win)           want="PE32+*x86-64*" ;;
              mac)           want="Mach-O*x86_64*" ;;
              mac-aarch64)   want="Mach-O*arm64*" ;;
              linux)         want="ELF*x86-64*" ;;
              linux-aarch64) want="ELF*ARM aarch64*" ;;
            esac
            jar=$(ls client-dist/target/*-"$p".jar)
            rm -rf /tmp/nat && mkdir -p /tmp/nat
            # `|| true` because unzip exits 11 for the two patterns that cannot match — only
            # one glass native exists per jar. The real assertion is the emptiness check below,
            # which also catches the case this step exists for: a jar with no native at all.
            unzip -o -q "$jar" 'libglass.dylib' 'libglass.so' 'glass.dll' -d /tmp/nat || true
            lib=$(ls /tmp/nat | head -1)
            if [ -z "$lib" ]; then
              echo "::error::$p jar contains no glass native"; exit 1
            fi
            desc=$(file -b "/tmp/nat/$lib")
            echo "$p -> $lib :: $desc"
            case "$desc" in
              $want) ;;
              *) echo "::error::$p jar carries the wrong architecture: $desc"; exit 1 ;;
            esac
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp client-dist/target/eyeandsickle-client-dist-*-{win,mac,mac-aarch64,linux,linux-aarch64}.jar dist/
          # The `-boot` classifier IS the runnable server; the unclassified jar is the plain
          # library artifact that keeps `server` resolvable as a normal dependency (server/pom.xml).
          cp server/target/eyeandsickle-server-*-boot.jar dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 14

  # Self-contained applications with a bundled Java runtime — the `-Pnative` profile in
  # client/pom.xml. One job per platform, because jpackage CANNOT CROSS-COMPILE: it emits a
  # platform-native launcher binary and embeds the runtime of the JDK running the build. That is
  # the whole reason this is a matrix and the jar build above is not.
  #
  # ⚠ TAGS AND MANUAL RUNS ONLY, and that is a BILLING decision with an expiry date, not a
  # judgement about how often packaging breaks. While this repository is private GitHub bills
  # minutes at 2x on Windows and 10x on macOS, so a ~4-minute jpackage build across these three
  # legs costs 4 + 8 + 40 ≈ 50 billed minutes every time it runs. Use `workflow_dispatch` to
  # check packaging before tagging.
  #
  # WHEN THIS REPOSITORY GOES PUBLIC, standard runners are free and this restriction should go:
  # add `push` to the condition (or delete the `if:` and let the workflow triggers govern it) so
  # packaging breaks surface on the commit that caused them rather than at the tag.
  #
  # Runner images already carry what jpackage needs, so there is no install step: WiX 3.14 on
  # windows-latest (jpackage needs WiX 3.0+), fakeroot + dpkg-dev on ubuntu-latest, and nothing
  # extra on macOS unless the package is signed or given a custom DMG icon.
  native:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      # One platform failing must not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            ext: deb
            glass: libglass.so
            arch: 'ELF*x86-64*'
          - os: windows-latest
            label: windows-x64
            ext: msi
            glass: glass.dll
            # Empty: `file` is not reliably present in Git for Windows' bash, and there is only
            # one Windows architecture in this matrix, so the name check below is the whole test.
            arch: ''
          # ⚠ APPLE SILICON ONLY, BY DECISION. macos-latest is arm64, and there is deliberately
          # no Intel leg: adding `macos-15-intel` here is all it would take, and the arch check
          # below would then be the thing keeping the two apart, because both runners produce an
          # identically named `libglass.dylib`. Intel Macs are served by the `-mac.jar` from the
          # jar job, which needs a JDK 25+ installed.
          - os: macos-latest
            label: mac-aarch64
            ext: dmg
            glass: libglass.dylib
            arch: 'Mach-O*arm64*'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # ⚠ jpackage will not take ${revision}, and it will not take a v0.x tag either.
      # `--app-version` must be one to three integers, so `0.2.0-rc1` is rejected outright; and
      # on macOS it becomes CFBundleVersion, where "the first number cannot be zero". Both
      # measured. So the EMBEDDED version is normalised (0.X.Y -> 1.X.Y) while the FILE NAME
      # keeps the true tag — the same split the jar rename below already uses, for the same
      # reason: the tag is the truth and the artifact metadata bends to the packager's rules.
      #
      # ⚠ Known one-time discontinuity: when the project really reaches v1.0.0 the embedded
      # version goes from 1.9.x back to 1.0.0, so Windows will treat that .msi as a fresh install
      # rather than an upgrade. Worth knowing before the 1.0 release, not worth encoding a
      # cleverer mapping for.
      - name: Derive a version jpackage will accept
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          raw="${GITHUB_REF_NAME#v}"
          core="${raw%%-*}"
          # A manual run sits on a branch, whose name is not a version.
          case "$core" in
            ''|*[!0-9.]*) core="0.0.0"; raw="dev" ;;
          esac
          IFS=. read -r maj min pat <<<"$core"
          min="${min:-0}"
          pat="${pat:-0}"
          # An `if`, not `[ ... ] && maj=1`: under `set -e` that idiom's exemption from the
          # errexit rule is subtle enough that someone will eventually "tidy" it into a bug.
          if [ "$maj" -eq 0 ]; then maj=1; fi
          echo "app=$maj.$min.$pat" >> "$GITHUB_OUTPUT"
          echo "file=$raw" >> "$GITHUB_OUTPUT"
          echo "embedded $maj.$min.$pat, filename $raw"

      # -am builds protocol and solo first; client-dist is not in the graph, so nothing here
      # shades five platforms' worth of jars.
      - name: Build the host-platform installer
        shell: bash
        run: >
          mvn -B -ntp -Pnative -Djpackage.installer=true
          -Djpackage.appVersion=${{ steps.ver.outputs.app }}
          -pl client -am package -DskipTests

      # ⚠ The one thing that CAN still go wrong per-platform. jpackage's own output is
      # necessarily the runner's architecture, but the JavaFX natives inside the shaded jar come
      # from Maven resolving org.openjfx's os.name/os.arch profiles — and if that resolves to the
      # wrong classifier, the installer builds cleanly and the application dies on launch. Same
      # check as the jar job, one directory over. `jar` is used rather than `unzip` because Git
      # for Windows does not ship unzip and the JDK is already here.
      - name: Verify the packaged JavaFX native matches this runner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nat && mkdir nat && cd nat
          jar xf ../client/target/jpackage-input/eyeandsickle-client.jar '${{ matrix.glass }}'
          if [ ! -f '${{ matrix.glass }}' ]; then
            echo "::error::${{ matrix.label }} carries no ${{ matrix.glass }} — wrong JavaFX classifier resolved"
            exit 1
          fi
          if [ -n '${{ matrix.arch }}' ]; then
            desc=$(file -b '${{ matrix.glass }}')
            echo "${{ matrix.label }} -> ${{ matrix.glass }} :: $desc"
            case "$desc" in
              ${{ matrix.arch }}) ;;
              *) echo "::error::${{ matrix.label }} carries the wrong architecture: $desc"; exit 1 ;;
            esac
          fi

      # Renamed here rather than in the release job because jpackage names the two macOS DMGs
      # identically — merging the artifacts would silently keep one of them.
      - name: Name the installer after the tag
        shell: bash
        run: |
          set -euo pipefail
          out=$(ls client/target/jpackage/*.${{ matrix.ext }})
          mkdir -p native-dist
          mv "$out" "native-dist/the-eye-and-sickle-${{ steps.ver.outputs.file }}-${{ matrix.label }}.${{ matrix.ext }}"
          ls -la native-dist

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.label }}
          path: native-dist/
          retention-days: 14

  release:
    # Tags only. A branch push builds and tests but publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      # The three native jobs each upload one already-tag-named file, so merge-multiple is safe:
      # the names cannot collide the way jpackage's own output does.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist

      # Built jars carry the POM version (0.1.0-SNAPSHOT), which would be actively misleading
      # hanging off a v1.2.3 release page. Renamed rather than running `versions:set` during the
      # build, so the tag never has to agree with a file nobody remembered to bump.
      - name: Name the files after the tag, and checksum them
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd dist
          # Iterating the known platforms rather than parsing them out of the filename: the
          # patterns are unambiguous (`*-mac.jar` cannot match `*-mac-aarch64.jar`) and a
          # renaming step that silently no-ops is how a release ships one fewer file than it
          # should. A missing platform now fails the job instead.
          for platform in win mac mac-aarch64 linux linux-aarch64; do
            src=$(ls eyeandsickle-client-dist-*-"$platform".jar)
            mv "$src" "the-eye-and-sickle-${version}-${platform}.jar"
          done
          server=$(ls eyeandsickle-server-*-boot.jar)
          mv "$server" "the-eye-and-sickle-server-${version}.jar"
          # Published so a download can be verified. This game's own manual teaches why that
          # matters; shipping unverifiable binaries alongside it would be poor form.
          #
          # The installers arrive already named for the tag (the native jobs rename them, because
          # jpackage gives both macOS DMGs the same name). Extensions are listed explicitly
          # rather than globbing `./*` so that a leg which silently produced nothing fails here
          # instead of shipping a checksum file that is quietly a line short.
          sha256sum ./*.jar ./*.deb ./*.msi ./*.dmg > SHA256SUMS
          cat SHA256SUMS

      # `gh` is preinstalled on GitHub runners, so releasing needs no third-party action and
      # therefore adds no supply-chain surface to a repository that publishes executables.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # A tag carrying a hyphen (v1.0.0-rc1, v0.2.0-beta) is a prerelease. Computed into a
          # variable rather than inlined as $( ) in the argument list, where an unset result and
          # a failed test are indistinguishable.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          # ⚠ Built with printf, not a heredoc. A heredoc body has to sit at column 0 to let an
          # unindented terminator close it, and column 0 breaks straight out of this YAML block
          # scalar — the workflow then fails to parse rather than failing to run. Every line here
          # stays indented, so the YAML and the shell agree.
          printf '%s\n' \
            "## The Eye and Sickle $version" \
            "" \
            "### Client — installers (no Java needed)" \
            "" \
            "These bundle their own Java runtime. Install and run; nothing else is required." \
            "" \
            "| File | For |" \
            "|---|---|" \
            "| the-eye-and-sickle-$version-windows-x64.msi | Windows (x64) |" \
            "| the-eye-and-sickle-$version-mac-aarch64.dmg | macOS (Apple Silicon) |" \
            "| the-eye-and-sickle-$version-linux-x64.deb | Linux (x64, Debian/Ubuntu) |" \
            "" \
            "They are unsigned, so first launch needs Gatekeeper's right-click → Open on macOS" \
            "and \"More info → Run anyway\" on Windows SmartScreen." \
            "" \
            "### Client — portable jars (bring your own Java)" \
            "" \
            "Run with \`java -jar <file>\`. Requires a **JDK or JRE 25+** on your machine; these do" \
            "not bundle a Java runtime. This is the route for **Intel Macs** and **Linux ARM**," \
            "which have no installer above." \
            "" \
            "| File | For |" \
            "|---|---|" \
            "| the-eye-and-sickle-$version-win.jar | Windows (x64) |" \
            "| the-eye-and-sickle-$version-mac-aarch64.jar | macOS (Apple Silicon) |" \
            "| the-eye-and-sickle-$version-mac.jar | macOS (Intel) |" \
            "| the-eye-and-sickle-$version-linux.jar | Linux (x64) |" \
            "| the-eye-and-sickle-$version-linux-aarch64.jar | Linux (ARM) |" \
            "" \
            "The client runs **offline out of the box** — no account, no network, no database." \
            "" \
            "### Server" \
            "" \
            "the-eye-and-sickle-server-$version.jar — the self-hostable home server." \
            "Needs PostgreSQL; see \`deploy/\` for Docker Compose." \
            "" \
            "### Verifying" \
            "" \
            "SHA256SUMS covers every file above: \`sha256sum -c SHA256SUMS\`" \
            > notes.md
          cat notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "The Eye and Sickle $version" \
            --notes-file notes.md \
            --verify-tag \
            $prerelease \
            dist/*.jar dist/*.deb dist/*.msi dist/*.dmg dist/SHA256SUMS
